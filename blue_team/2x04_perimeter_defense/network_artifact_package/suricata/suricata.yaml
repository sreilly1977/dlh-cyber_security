# suricata.yaml - MedDefense offline replay configuration
# Generated by 8-suricata_setup.sh
# Date: 2026-08-14T16:31:57Z

%YAML 1.1
---

default-log-dir: /var/log/suricata
default-rule-path: /var/lib/suricata/rules

# Rule files loaded for offline analysis
rule-files:
  - botcc.portgrouped.rules
  - botcc.rules
  - ciarmy.rules
  - compromised.rules
  - drop.rules
  - dshield.rules
  - emerging-activex.rules
  - emerging-adware_pup.rules
  - emerging-attack_response.rules
  - emerging-chat.rules
  - emerging-coinminer.rules
  - emerging-current_events.rules
  - emerging-deleted.rules
  - emerging-dns.rules
  - emerging-dos.rules
  - emerging-exploit_kit.rules
  - emerging-exploit.rules
  - emerging-ftp.rules
  - emerging-games.rules
  - emerging-hunting.rules
  - emerging-icmp_info.rules
  - emerging-icmp.rules
  - emerging-imap.rules
  - emerging-inappropriate.rules
  - emerging-info.rules
  - emerging-ja3.rules
  - emerging-malware.rules
  - emerging-misc.rules
  - emerging-mobile_malware.rules
  - emerging-netbios.rules
  - emerging-p2p.rules
  - emerging-phishing.rules
  - emerging-policy.rules
  - emerging-pop3.rules
  - emerging-retired.rules
  - emerging-rpc.rules
  - emerging-scada.rules
  - emerging-scan.rules
  - emerging-shellcode.rules
  - emerging-smtp.rules
  - emerging-snmp.rules
  - emerging-sql.rules
  - emerging-telnet.rules
  - emerging-tftp.rules
  - emerging-user_agents.rules
  - emerging-voip.rules
  - emerging-web_client.rules
  - emerging-web_server.rules
  - emerging-web_specific_apps.rules
  - emerging-worm.rules
  - threatview_CS_c2.rules
  - tor.rules
  - zz-meddefense-supplemental.rules
  - meddefense.rules

# HOME_NET covers all MedDefense internal zones (DMZ, INTERNAL, MGMT, MEDDEV)
vars:
  address-groups:
    HOME_NET: "[10.10.0.0/16]"
    EXTERNAL_NET: "!$HOME_NET"
    HTTP_SERVERS: "$HOME_NET"
    SMTP_SERVERS: "$HOME_NET"
    DNS_SERVERS: "$HOME_NET"
    TLS_SERVERS: "$HOME_NET"
    SQL_SERVERS: "$HOME_NET"
  port-groups:
    HTTP_PORTS: "80"
    SHELLCODE_PORTS: "!80"
    SSH_PORTS: "22"

# pcap-file replay mode (offline analysis, no live interface)
pcap-file:
  enabled: true

outputs:
  - eve-log:
      enabled: true
      filetype: regular
      filename: eve.json
      community-id: false
      types:
        - alert:
            tagged-packets: yes
        - http:
            extended: yes
        - dns:
            query: yes
        - tls:
            extended: yes
        - files
        - anomaly:
            enabled: no
        - ssh
  - stats:
      enabled: true
      filename: stats.log
      totals: yes

app-layer:
  protocols:
    http:
      enabled: true
    tls:
      enabled: true
    dns:
      enabled: true

file-store:
  enabled: true

logging:
  default-log-level: notice
  outputs:
    - console:
        enabled: true
    - file:
        enabled: false

af-packet:
  - interface: eth0
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes
    use-mmap: yes
    tpacket-v3: yes

# Live capture disabled - offline replay only
capture:
  kernel-packet-filter: false

# Host information
host-os-policy:
  linux: enabled
  windows: enabled
  macos: disabled
  bsd: disabled
