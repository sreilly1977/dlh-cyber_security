#!/usr/sbin/nft -f
#
# nftables.conf - MedDefense perimeter defense ruleset
# Generated by 4-nftables_config.sh
# Local zone: INTERNAL
# Generated at: 20260814T154048Z

flush ruleset

table inet meddefense {
    # Zone network sets
    set dmz_net {
        type ipv4_addr
        flags interval
        elements = { 10.10.2.0/24 }
    }
    set internal_net {
        type ipv4_addr
        flags interval
        elements = { 10.10.1.0/24 }
    }
    set mgmt_net {
        type ipv4_addr
        flags interval
        elements = { 192.168.10.0/24 }
    }
    set meddev_net {
        type ipv4_addr
        flags interval
        elements = { 10.10.3.0/24 }
    }

    chain input {
        type filter hook input priority 0; policy drop;

        # Connection tracking - accept established and related
        ct state established,related accept

        # Loopback interface
        iif "lo" accept

        # ICMP minimal accept for diagnostics
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # Allow rules for flows terminating on local host (zone: INTERNAL)
        ip saddr @mgmt_net tcp dport 22 accept comment "Administration access to clinical servers"
        ip saddr @dmz_net tcp dport 3306 accept comment "DMZ application hosts to INTERNAL databases"
        ip saddr @meddev_net tcp dport 4242 accept comment "DICOM imaging to PACS"
        ip saddr @meddev_net tcp dport 443 accept comment "EHR web integration for device display"

        # Drop and log terminal rule
        log prefix "nft-meddefense-input-drop: " flags all counter drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        # Connection tracking
        ct state established,related accept

        # Cross-zone allow rules rendered from flow matrix

        ip saddr @mgmt_net ip daddr @internal_net tcp dport 22 accept comment "Administration access to clinical servers"
        ip saddr @mgmt_net ip daddr @dmz_net tcp dport 22 accept comment "Administration access to DMZ hosts"
        ip saddr @dmz_net ip daddr @internal_net tcp dport 3306 accept comment "DMZ application hosts to INTERNAL databases"
        ip saddr @meddev_net ip daddr @internal_net tcp dport 4242 accept comment "DICOM imaging to PACS"
        ip saddr @meddev_net ip daddr @internal_net tcp dport 443 accept comment "EHR web integration for device display"
        ip saddr @dmz_net ip daddr @mgmt_net udp dport 53 accept comment "DNS resolution to MGMT resolver"
        ip saddr @dmz_net ip daddr @mgmt_net tcp dport 53 accept comment "DNS resolution to MGMT resolver"
        ip saddr @internal_net ip daddr @mgmt_net udp dport 53 accept comment "DNS resolution to MGMT resolver"
        ip saddr @internal_net ip daddr @mgmt_net tcp dport 53 accept comment "DNS resolution to MGMT resolver"
        ip saddr @meddev_net ip daddr @mgmt_net udp dport 53 accept comment "DNS resolution to MGMT resolver"
        ip saddr @meddev_net ip daddr @mgmt_net tcp dport 53 accept comment "DNS resolution to MGMT resolver"
        ip saddr @mgmt_net ip daddr @meddev_net tcp dport 22 accept comment "Administration access to medical devices"
        ip saddr @mgmt_net ip daddr @meddev_net tcp dport 4242 accept comment "DICOM management to medical devices"
        ip saddr @dmz_net ip daddr @meddev_net log prefix "nft-meddefense-deny-DMZ-MEDDEV: " drop comment "No flows from DMZ to MEDDEV (medical device isolation)"
        ip saddr @internal_net ip daddr @dmz_net log prefix "nft-meddefense-deny-INTERNAL-DMZ: " drop comment "No flows from INTERNAL to DMZ (segmentation enforcement)"
        ip saddr @internal_net ip daddr @meddev_net log prefix "nft-meddefense-deny-INTERNAL-MEDDEV: " drop comment "No flows from INTERNAL to MEDDEV (medical device isolation)"
        ip saddr @meddev_net ip daddr @dmz_net log prefix "nft-meddefense-deny-MEDDEV-DMZ: " drop comment "No flows from MEDDEV to DMZ or public Internet"

        # Drop and log terminal rule
        log prefix "nft-meddefense-forward-drop: " flags all counter drop
    }

    chain output {
        type filter hook output priority 0; policy accept;

        # Connection tracking
        ct state established,related accept

        # Explicit drops for zones that must not receive outbound from this host

        ip daddr @dmz_net log prefix "nft-meddefense-output-drop-DMZ: " drop comment "No flows from INTERNAL to DMZ (segmentation enforcement)"
        ip daddr @meddev_net log prefix "nft-meddefense-output-drop-MEDDEV: " drop comment "No flows from INTERNAL to MEDDEV (medical device isolation)"
    }
}
