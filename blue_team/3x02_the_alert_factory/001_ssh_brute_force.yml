title: SSH Repeated Authentication Failures from Single Source
id: 7f3c1a2e-4b8d-4d92-9a1f-6e5c0b7a8d94
status: experimental
description: >
    Detects SSH authentication brute forcing against MedDefense Linux infrastructure.
    Threat: repeated failed password attempts from a single source, consistent with
    password guessing or spray prelude to account compromise (MITRE T1110.001
    Password Guessing). Data source: normalized authentication telemetry from the
    3x00 evidence pipeline, Linux auth records where canonical_label is login_failure.
    Fires when a single source IP exceeds the failure threshold within the 120s
    timeframe. Operational response: SOC Tier 1 reviews the source IP against the
    asset zone, checks for any subsequent login_success from the same IP (correlate
    against T004 class rules), verifies the targeted account against the risk
    register, and escalates to Tier 2 for host isolation and credential reset if a
    success follows the burst.
author: Steve - Cybersecurity Engineer
date: 2026/09/04
references:
    - https://attack.mitre.org/techniques/T1110/001/
logsource:
    product: linux
    service: auth
detection:
    selection:
        canonical_label: 'login_failure'
        event_category: 'authentication'
    condition: selection | count() by src_ip > 5
    timeframe: 120s
falsepositives:
    - Clinical staff mistyping credentials during busy shift handovers at clin-ws workstations
    - Automated backup jobs (svc_backup) failing after scheduled credential rotation on Saturday mornings
    - Misconfigured monitoring probes retrying with stale credentials after ticket expiry
level: high
tags:
    - attack.credential_access
    - attack.t1110.001
