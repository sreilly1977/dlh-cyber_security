title: Credential Theft Chain - Brute Force to Foreign-Source Success to Privilege Escalation
id: f5b0c1d7-8e5a-4b0f-c7a2-1d7f3e6b9c84
status: experimental
description: >
    Detects the three-stage credential compromise chain (MITRE T1110 Brute
    Force feeding T1078 Valid Accounts): first, three or more authentication
    failures for one user from source IP A inside a 300-second window,
    indicating active password guessing or spraying against the account;
    second, a successful authentication for that same user from a DIFFERENT
    source IP B within 300 seconds of the failure burst, the signature of an
    attacker who obtained valid credentials consuming them from their own
    position rather than the legitimate user recovering from typos on the
    same subnet; third, any privilege_escalation activity on the same host
    within 600 seconds of that success, closing the chain from access to
    escalation. The three stages map to credential access (T1110), initial
    access via valid accounts (T1078), and the escalation behaviors labeled
    by the 3x01 taxonomy (sudo, su, account manipulation). Single-stage
    detection of any one leg is noisy by nature - failed logons and
    privilege use are routine individually - but their ordered co-occurrence
    across distinct source addresses within tight time bounds is specific
    enough to warrant critical severity. This environment exhibited exactly
    this chain on 25 March 2026: a distributed brute force from the
    203.0.113.40/24 range against db-patient-01 culminating in a successful
    logon from 203.0.113.41. Extension note: correlation_primitive is a
    custom field; the sigma_runner delegates cross-source matching to
    8-correlation_primitives.py, which preprocesses labeled events into
    chain records (correlation_primitives.json) consumed via --preprocess,
    so this rule is evaluated one-chain-per-record rather than
    event-by-event. Operational response: immediate Tier 2 engagement,
    credential rotation for the affected account, session termination on
    the target host, and containment review of both source addresses;
    CRITICAL register assets (db-patient-01, srv-dc-01/02, srv-ehr-01)
    jump the queue.
author: Steve - Cybersecurity Engineer
date: 2026/09/05
references:
    - https://attack.mitre.org/techniques/T1110/
    - https://attack.mitre.org/techniques/T1078/
logsource:
    category: authentication
detection:
    selection:
        correlation_primitive: 'credential_compromise_chain'
    condition: selection
falsepositives:
    - Users mistyping a password repeatedly from the office network, then succeeding via VPN egress (a different source IP), followed by unrelated legitimate sudo activity on a shared bastion host
    - Scheduled credential rotation tools failing stale credentials in a burst before succeeding from the management appliance
level: critical
tags:
    - attack.credential_access
    - attack.t1110
    - attack.t1078
