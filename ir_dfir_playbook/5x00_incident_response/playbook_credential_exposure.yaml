# MedDefense Health Systems — Playbook: Credential Exposure
# Name: playbook_credential_exposure.yaml
# Purpose: Execute a confirmed credential compromise response, hybrid AD/Azure AD, per template.
# Author: Steve - Cybersecurity Engineer
# Date: 09 October 2026

playbook_id: PB-001
title: Confirmed Credential Exposure — Phishing to Foreign-IP Sign-In
owner_role: SOC Analyst (on-call), IR_Commander for actions marked decision_point

applies_to:
  triggers:
    - SIEM alert: Azure AD sign-in from ASN geolocation mismatched to user home site
    - SIEM alert: impossible travel — two sign-ins from distant geographies within one hour
    - Report from user or helpdesk: credentials entered on a page outside *.meddefense.local or the approved SSO domain
    - EDR: browser credential dump or phishing kit post-auth redirect observed
  indicators:
    - Suspicious user agent on Azure AD sign-in logs (unknown client type or legacy auth)
    - MFA push flood followed by approval (MFA fatigue pattern)
    - Failed sign-ins from foreign IP range preceding success from same range
    - Mailbox rule creation, forwarding, or OAuth consent grant shortly after foreign-IP sign-in

severity_mapping:
  initial: SEV2
  escalate_if:
    - ePHI access confirmed during the exposure window (Data Exposure: confirmed_limited to confirmed_broad)
    - Attacker pivots to additional accounts or performs privilege escalation
    - Compromised account used to reach Epic from an unrecognized device or location
    - Exposure window exceeds 24 hours before detection

immediate_actions:
  - step: Confirm the foreign-IP sign-in in Azure AD sign-in logs; record IP, ASN, timestamp, device ID, MFA result
    owner: SOC Analyst
    timebox_minutes: 5
  - step: Declare SEV2, open the incident record, start the timeline, notify IR_Commander per escalation path
    owner: SOC Analyst
    timebox_minutes: 5
  - step: Freeze mailbox rules and OAuth grants for the account via read-only review — do not modify yet (modification destroys attacker-session visibility)
    owner: SOC Analyst
    timebox_minutes: 5

evidence_preservation:
  - artifact: Azure AD sign-in log export for the account, exposure window minus 30 days
    method: Azure portal / Graph API export to case folder on write-once share
    before_step: Active Directory password reset
  - artifact: On-prem AD authentication logs (domain controller security logs, 4624/4768/4769) for the account
    method: SIEM export of raw events to case folder
    before_step: Active Directory password reset
  - artifact: Affected mailbox export (.pst) including all folders, hidden and deleted items
    method: Exchange Online / on-prem mail export per evidence procedure; hash and record chain of custody
    before_step: Any mailbox modification or deletion by containment actions
  - artifact: Recent data access audit export — Epic break-the-glass and chart-access logs, SharePoint/OneDrive file access for the account
    method: Epic audit log pull and Microsoft 365 unified audit log export to case folder
    before_step: Azure AD session revocation (which invalidates tokens containing access history pointers)
  - artifact: Screen capture of the phishing page, URL, and full message headers of the phishing email
    method: Header export to case folder; defang URL for record; submit URL to sandbox detonation — never navigate directly
    before_step: Reporting the phishing campaign or purging related email

containment_actions:
  - step: Active Directory password reset for the compromised account
    owner: SOC Analyst
    decision_point: RESET NOW VS MONITOR — see documented decision below
    trade_off: Terminates attacker ability to authenticate going forward; sacrifices attacker-session visibility and any queued post-exploitation actions the adversary may have staged. Resetting blind may tip the attacker before scope is known.
  - step: Azure AD session revocation — revoke all refresh tokens and active sessions for the account
    owner: SOC Analyst
    trade_off: Immediately kills live attacker sessions; also terminates the legitimate user's sessions, causing a productivity hit and a helpdesk call, and may destroy token-artifact evidence if not exported first.
  - step: MFA device reset — unregister attacker-registered authenticator methods, re-enroll legitimate user
    owner: SOC Analyst
    trade_off: Restores strong authentication; requires verified user identity re-proofing (in-person or manager callback), delaying return to service by up to 30 minutes.
  - step: VPN token revocation — revoke any issued VPN certificates or remote-access tokens tied to the account
    owner: Network Engineer (Mike Torres' function)
    trade_off: Blocks remote persistence into the corporate network; disconnects the legitimate user if working remotely, forcing re-authentication through a clean device.
  - step: Epic session termination — force sign-out of all Hyperspace sessions for the account and lock Epic access pending review
    owner: SOC Analyst with IT Director coordination
    trade_off: Stops any active patient-record browsing by the attacker; removes clinical access for the legitimate user, which is clinically disruptive if the user is providing care at the time of the incident.

eradication_actions:
  - Remove attacker-created inbox rules, forwarding addresses, and OAuth application consents granted by the account
  - Hunt for persistence: review devices the attacker signed in from; if a device touched corporate resources, place it in quarantine for forensic imaging
  - Purge the phishing email from all mailboxes org-wide via search-and-destroy; block sender domain and URLs at the mail gateway
  - Validate the account's group memberships against baseline; remove any membership added during the exposure window
  - Reset passwords on any accounts sharing credentials with the compromised account, if policy violations indicate reuse

recovery_validation:
  - check: Azure AD sign-in logs for the account, 24 hours post-containment
    criterion: Zero successful sign-ins from unfamiliar ASNs, geographies, or device IDs
  - check: MFA registration report for the account
    criterion: Only verified enrollment methods belonging to the legitimate user; no voice/SMS fallbacks the attacker registered
  - check: Epic and Microsoft 365 audit logs for the account, 24 hours post-containment
    criterion: No ePHI or data access attributable to the attacker after the containment timestamp
  - check: User interview and awareness confirmation
    criterion: User verbally confirms credential re-entry only on legitimate MedDefense SSO pages and understands the phishing vector

communication_plan:
  - audience: Affected user and their department manager
    trigger: On containment completion, before session restoration
    template: credexposure_user_notification.md
  - audience: SOC Lead / IR_Commander
    trigger: Every stage gate — detection, preservation complete, containment complete, ePHI determination
    template: sev_status_update.md
  - audience: Legal_Liaison (General Counsel)
    trigger: Immediately upon the HIPAA assessment confirming ePHI access in the exposure window
    template: legal_notification_ephi.md
  - audience: All staff
    trigger: If the phishing campaign is confirmed to target multiple MedDefense users
    template: phishing_awareness_advisory.md

escalation_triggers:
  - ePHI access confirmed during the exposure window — reclassify Data Exposure to confirmed_limited or confirmed_broad; notify Legal_Liaison per Breach Notification Rule clock
  - Second account compromise identified — reclassify toward SEV1 per severity_matrix.md; expand investigation org-wide
  - Attacker privilege escalation to administrative role observed — immediate IR_Commander engagement and SEV1 evaluation
  - Account linked to privileged clinical system administration (Epic or LIS admin) — raise to SEV1 given blast radius

post_incident_tasks:
  - Complete the HIPAA four-factor risk assessment documenting ePHI accessibility, volume, and individuals affected; deliver to General Counsel for the breach-reportability determination
  - Determine why the phishing email reached the inbox and whether gateway rules require tuning
  - Determine whether the user's MFA approval was fatigue-induced or attacker-approved, and whether number-matching or stronger policy is warranted
  - Assess conditional access gap that permitted foreign-IP sign-in; propose location and device-compliance controls
  - Add the IOCs (IP ranges, user agents, phishing domains) to SIEM watchlists and Wazuh threat intelligence
  - Update this playbook and the phishing detection rules with lessons learned
