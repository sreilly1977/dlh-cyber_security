    command_or_action: rebuild from known-good baseline image
    verification_command: live-response GET /endpoint/processtree/WST-WS-017 and GET /endpoint/persistence/WST-WS-017 post-rebuild
    expected_verification_result: no PowerShell->MSBuild lineage in inspected trees; persistence fields all empty or absent
