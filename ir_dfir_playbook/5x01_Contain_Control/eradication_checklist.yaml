    verification_command: live-response GET /endpoint/processtree/WST-WS-031 and GET /endpoint/persistence/WST-WS-031 post-rebuild
    expected_verification_result: no PowerShell->MSBuild lineage in inspected trees; persistence fields all empty or absent
