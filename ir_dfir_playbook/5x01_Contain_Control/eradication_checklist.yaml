  - id: ERAD-006
    category: malware_artifact
    target_host: LIS-WSIDE-01
    description: No dropped payload observed on LIS-WSIDE-01 (access was read-only per event 4663 entries); item is a verification sweep for persistence introduced via the cifs session
    command_or_action: none; sweep only
