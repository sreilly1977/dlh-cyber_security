# eradication_checklist.yaml
# Incident: IR-2026-0414-01
# Scope: WST-WS-031, WST-WS-017, LIS-WSIDE-01, dmarsh account, Kerberos trust material, both C2 IPs
# Grounding: file/process/PID/network facts from alert_A-20260414-9841.json, edr_wst_ws_031_24h.jsonl,
#            auth_expansion_0334Z.log, proxy_24h_dmarsh.log
items:
  - id: ERAD-001
    category: malware_artifact
    target_host: WST-WS-031
    description: Remove dropped payloads C:\Users\dmarsh\AppData\Local\Temp\update.xml and C:\Users\dmarsh\AppData\Local\Temp\update.exe (update.xml executed by MSBuild PID 8104 per alert; update.exe implied by update.zip download at 2026-04-13T18:14:43Z)
    command_or_action: Remove-Item -Force C:\Users\dmarsh\AppData\Local\Temp\update.xml, C:\Users\dmarsh\AppData\Local\Temp\update.exe
    verification_command: PowerShell Test-Path on both paths; endpoint live-response GET /endpoint/persistence/WST-WS-031 and inspect temp_dropped_payloads
    expected_verification_result: both Test-Path calls return False; live-response temp_dropped_payloads reports both paths "absent"
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-002
    category: malware_artifact
    target_host: WST-WS-031
    description: Remove scheduled task persistence with random GUID name created on WST-WS-031
    command_or_action: schtasks /delete /tn <GUID-name task> /f
    verification_command: schtasks /query | findstr /i "<GUID>"; live-response GET /endpoint/persistence/WST-WS-031 and inspect scheduled_tasks_with_guid_names
    expected_verification_result: no matching task in schtasks query; live-response scheduled_tasks_with_guid_names is empty list
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-003
    category: malware_artifact
    target_host: WST-WS-031
    description: Remove registry Run-key persistence in HKCU and HKLM Software\Microsoft\Windows\CurrentVersion\Run
    command_or_action: Remove-ItemProperty on identified malicious Run-key values under HKCU and HKLM Run paths
    verification_command: reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Run"; reg query "HKLM\Software\Microsoft\Windows\CurrentVersion\Run"; live-response GET /endpoint/persistence/WST-WS-031
    expected_verification_result: both Run keys contain no unexpected values; live-response run_keys arrays are empty
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-004
    category: malware_artifact
    target_host: WST-WS-017
    description: Remove dropped payload C:\Users\dmarsh\AppData\Local\Temp\update.xml on WST-WS-017 (FILE_CREATE at 2026-04-14T03:23:59Z, sha256 a4f1e9b4fe7aa6d5d3f3e2b8c9a7d4e8f5b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3, per auth_expansion_0334Z.log)
    command_or_action: Remove-Item -Force C:\Users\dmarsh\AppData\Local\Temp\update.xml
    verification_command: Test-Path C:\Users\dmarsh\AppData\Local\Temp\update.xml; live-response GET /endpoint/persistence/WST-WS-017
    expected_verification_result: Test-Path returns False; live-response temp_dropped_payloads reports path "absent"
