  - id: ERAD-011
    category: credential
    target_host: domain
    description: Reset dmarsh AD password and revoke all Azure AD sessions and refresh tokens (credentials phished 2026-04-13T18:14:41Z via ms0365-support[.]login-verification[.]click per proxy log and Azure AD sign-in record)
    command_or_action: Set-ADAccountPassword -Identity dmarsh; Revoke-AzureADUserAllRefreshToken -ObjectId dmarsh@meddefense.local
    verification_command: query Azure AD sign-in logs and AD security log for dmarsh for successful authentication using pre-reset tokens or old password after reset timestamp
    expected_verification_result: zero successful sign-ins using pre-reset credentials or refresh tokens after the reset timestamp
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-012
    category: credential
    target_host: domain
    description: Invalidate outstanding dmarsh Kerberos tickets. Password reset alone does not revoke already-issued TGT/TGS tickets (the 03:41:52Z note "second_request_with_ticket_reuse" proves live ticket reuse). With 10h ticket lifetimes observed in the auth export, untreated tickets issued at 02:44:02Z remain valid until approximately 12:44Z
    command_or_action: explicit ticket invalidation via krbtgt reset (see ERAD-014) rather than waiting for natural expiry; monitor DC security log 4769 events for dmarsh SPN usage
    verification_command: DC security log query for dmarsh TGS_REQ / service ticket presentations after krbtgt reset timestamp
    expected_verification_result: no dmarsh ticket presentation succeeding after the krbtgt reset timestamp; earliest expiry events all pre-reset
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-013
    category: machine_account
    target_host: domain
    description: Rotate machine account passwords for WST-WS-031 and WST-WS-017; both hosts sustained SYSTEM-level attacker execution (services.exe-spawned payload on WST-WS-017; user-context to SYSTEM implied by ADMIN$ share deployment), so machine credentials must be presumed compromised
    command_or_action: Reset-ADComputer -Identity WST-WS-031$ -Reset; Reset-ADComputer -Identity WST-WS-017$ -Reset
    verification_command: nltest /sc_query:meddefense.local from each host post-rotation; DC security log for NTLM/Kerberos auth using old machine secrets
    expected_verification_result: secure channel re-established with new secret; zero successful authentications using prior machine account secrets
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-014
    category: krbtgt
    target_host: domain
    description: Double-reset of krbtgt
    command_or_action: Reset-ADAccountPassword -Identity krbtgt; wait for full AD replication across ms-dc01 and ms-dc02; Reset-ADAccountPassword -Identity krbtgt a second time
    rationale: Pass-the-Ticket by dmarsh is confirmed by the auth expansion log (consecutive TGS_REQ from non-authorized source host; "second_request_with_ticket_reuse" at 03:41:52Z). A password reset on dmarsh does not revoke already-issued tickets, and untreated tickets persist up to the 10h observed lifetime. The only complete invalidation of all outstanding TGTs and service tickets domain-wide, covering any ticket class we may not have observed, is rotating krbtgt twice (reset once, replicate, reset again) so that material derived from both the old and intermediate keys is dead. Trade-off accepted: temporary domain-wide authentication disruption during the replication window, coordinated with the West Campus Laboratory for a low-usage window
    verification_command: DC audit of TGT issuance post-reset; query for any Kerberos ticket validation using pre-reset keys across ms-dc01/ms-dc02
    expected_verification_result: no valid TGT or service ticket issued before the second reset timestamp authenticates successfully; all post-reset issuances use new keys
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-015
    category: network
    target_host: perimeter
    description: Egress deny for both C2 endpoints 185.220.101[.]47 (WST-WS-031 channel) and 91.234.99[.]107 (WST-WS-017 channel) at the perimeter firewall with logging
    command_or_action: firewall policy update adding deny rules for 185.220.101[.]47 and 91.234.99[.]107, all ports, both directions, with hit-count logging
    verification_command: netflow query for last 24 hours toward both IPs from the SIEM netflow endpoint
    expected_verification_result: zero packets and zero bytes to both IPs in the window (egress_deny_verified list contains both IPs)
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-016
    category: network
    target_host: internal
    description: Close the east-west containment gap demonstrated at 03:22:47Z-03:23:02Z: SMB (445), Kerberos-sourced logon_type=3, and ADMIN$ share access must be denied from the quarantine VLAN to all production segments, not just internet egress
    command_or_action: ACL update on quarantine VLAN 999 denying 445/135/139 and RPC dynamic ports toward production subnets while retaining IR jumpbox management access
    verification_command: controlled test of SMB and administrative share access from quarantined host to a production target; SIEM netflow for port 445 from quarantine subnet
    expected_verification_result: SMB and ADMIN$ access attempts fail from quarantine; zero successful port 445 flows from quarantine VLAN to production subnets
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-017
    category: network
    target_host: perimeter
    description: Block and sinkhole the phishing infrastructure domain ms0365-support[.]login-verification[.]click at DNS and proxy layers to prevent re-entry or continued victim credential capture
    command_or_action: DNS RPZ entry plus proxy category block for the domain
    verification_command: DNS query for the domain from an internal resolver; proxy test GET with the domain in URL
    expected_verification_result: domain resolves to sinkhole/NXDOMAIN from internal resolvers; proxy denies the request
    status: pending
    executed_at: null
    executed_by: null
