  - id: ERAD-005
    category: malware_artifact
    target_host: WST-WS-017
    description: Remove scheduled task and Run-key persistence established by the services.exe-spawned powershell (PID 4402) chain
    command_or_action: schtasks /delete /tn <GUID-name task> /f; Remove-ItemProperty on malicious Run-key values under HKCU and HKLM
    verification_command: schtasks /query | findstr /i "<GUID>"; reg query both Run keys; live-response GET /endpoint/persistence/WST-WS-017
    expected_verification_result: no matching scheduled task; Run keys clean; live-response scheduled_tasks_with_guid_names empty and run_keys arrays empty
