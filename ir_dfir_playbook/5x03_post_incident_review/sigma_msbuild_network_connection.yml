# Rule: MSBuild C2 Network Connection
# Level rationale: Set to medium, one tier below the T3 process creation
# rule (sigma_powershell_msbuild_lolbin.yml), because MSBuild.exe
# legitimately initiates outbound connections during NuGet package
# restore, telemetry, and build-related operations from developer
# workstations and CI agents. A standalone hit here is weak evidence;
# deployed alongside the process creation rule, it provides layered
# coverage. Correlation of both rules firing for the same host within
# 5 minutes should be escalated as high confidence.
#
# Exclusion logic: The filters below drop connections to RFC 1918
# private ranges and loopback, since C2 egress observed in
# IR-2026-0414-01 targeted public internet addresses (a Tor exit node
# and a bulletproof-hosted Cobalt Strike team server). Legitimate
# build activity against internal package mirrors (NuGet, Artifactory
# proxy) is therefore also excluded, accepting reduced visibility into
# internal-only C2 in exchange for a substantially lower alert rate.
#
# Known limitation: the 172.16.-172.31. range cannot be expressed with
# 'startswith' alone, so 172.17. through 172.31. are enumerated
# explicitly to cover the full RFC 1918 block.
#
# CHANGE LOG (tuned 2026-10-19, see rule_validation_report.md):
# - Added filter_nuget: DestinationHostname|endswith '.nuget.org',
#   extending the condition with 'and not filter_nuget'. Validated
#   against clean_sysmon.jsonl: 14/21 pre-tuning matches were MSBuild
#   NuGet restore connections to api.nuget.org (168.62.42.37:443)
#   from developer workstations WST-WS-042/WST-WS-051; post-tuning
#   matches dropped to 0 with no loss on incident data (both C2
#   events carry dst_hostname null, raw-IP). This version replaces
#   the original as the production artifact.

# Name: sigma_msbuild_network_connection.yml
# Purpose: Detect MSBuild.exe initiating outbound network connections to
#          public addresses, per IR-2026-0414-01 finding ART-002-M02
#          (MSBuild.exe PID 8104 connected to Tor exit 185.220.101.47:443).
# Author: Steve - Cybersecurity Engineer
# Date: 19 October 2026 (original); tuned 19 October 2026

title: MSBuild Initiating Outbound Network Connection
id: 9d4e2b7a-1c63-4f95-8a2d-6b3c7e91f4a8
status: test
description: >
  Detects MSBuild.exe initiating an outbound network connection to a
  public destination, excluding known-good package registry hostnames.
  Trusted developer utilities such as MSBuild have no routine reason
  to contact external hosts on general-purpose workstations. Observed
  during IR-2026-0414-01, where MSBuild.exe (PID 8104), injected with
  shellcode loaded from an inline-task XML, established TCP
  connections to attacker infrastructure over port 443, including Tor
  exit node 185.220.101.47.
references:
  - https://lolbas-project.github.io/lolbas/Binaries/Msbuild/
  - https://attack.mitre.org/techniques/T1071/001/
  - https://attack.mitre.org/techniques/T1090/003/
author: Steve - Cybersecurity Engineer
date: 2026-10-19
modified: 2026-10-19
tags:
  - attack.command_and_control
  - attack.t1071.001
  - attack.t1090.003
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    Image|endswith: '\MSBuild.exe'
    Initiated: 'true'
  filter_rfc1918:
    DestinationIp|startswith:
      - '10.'
      - '172.16.'
      - '172.17.'
      - '172.18.'
      - '172.19.'
      - '172.20.'
      - '172.21.'
      - '172.22.'
      - '172.23.'
      - '172.24.'
      - '172.25.'
      - '172.26.'
      - '172.27.'
      - '172.28.'
      - '172.29.'
      - '172.30.'
      - '172.31.'
      - '192.168.'
  filter_localhost:
    DestinationIp:
      - '127.0.0.1'
      - '::1'
  filter_nuget:
    DestinationHostname|endswith:
      - '.nuget.org'
  condition: >-
    selection and not filter_rfc1918 and not filter_localhost
    and not filter_nuget
falsepositives:
  - Visual Studio / MSBuild telemetry and extension update checks
    (Visual Studio Marketplace, Microsoft CDN ranges) initiated by
    msbuild.exe during interactive builds on engineering OUs; tune
    reactively via host inventory or DNS-based whitelist entries
    if observed in production.
  - Custom internal build tooling invoking MSBuild against public
    endpoints not yet allowlisted; review matched hostnames before
    adding further DestinationHostname exclusions.
level: medium
