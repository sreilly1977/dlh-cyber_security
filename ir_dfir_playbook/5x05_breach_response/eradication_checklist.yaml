  - id: ERT-016
    category: credential
    target_host: ALL_HOSTS
    description: >
      Rotate local administrator credentials on every in-scope host.
      jdoe was the sole compromised domain principal in the dwell
      evidence, but local admin reuse cannot be excluded.
    command_or_action: >
      Trigger LAPS rotation on each rebuilt host before it returns
      to the clinical VLAN.
    verification_command: >
      Get-LapsADPassword for each host; PasswordLastModified
      newer than rebuild timestamp.
    expected_verification_result: >
      Fresh LAPS password timestamp per host, none predating
      the rebuild.
    status: pending
    executed_at: null
    executed_by: null
  - id: ERT-017
    category: kerberos
    target_host: DOMAIN
    description: >
      Second krbtgt rotation, mandatory because of the LSASS access
      with mask 0x1010 (MEM-005). First rotation performed
      2026-04-20T22:10Z; second must follow no sooner than 10
      hours after the first (maximum ticket lifetime).
    command_or_action: >
      Set-ADAccountPassword krbtgt -Reset at T0+10h.
    verification_command: >
      DC Security log: zero EID 4768/4769 ticket grants to the
      retired jdoe principal after the second rotation; test
      workstation obtains fresh TGT successfully.
    expected_verification_result: >
