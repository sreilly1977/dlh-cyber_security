# Name: eradication_checklist.yaml
# Purpose: One item per eradication action for IR-2026-0420-01, covering
#          beacon processes, persistence, staged payloads, credentials,
#          Kerberos ticket invalidation, network controls, and machine
#          account rotation across all in-scope hosts. No item is marked
#          complete without recorded verification output.
# Author: Steve - Cybersecurity Engineer
# Date: 26 October 2026
meta:
  incident_id: IR-2026-0420-01
  prepared_by: Steve - on-call IR
  strategy: >
    Workstations CS-WS-101/104/107/112 and SCHED-SVR-01 are rebuilt
    from the gold image after evidence verification. FILE-SVR-01
    receives targeted removal plus full-volume scan because no
    ransomware staging script was placed on it (SYS-003 covers only
    the four workstations). Domain-level actions (credential,
    kerberos, network, machine_account) run on the DC or firewalls
    independently of host rebuild order.
  register_note: >
    Evidence register is ART-001..ART-011: memory+disk pairs for
    CS-WS-101, CS-WS-104, CS-WS-107, CS-WS-112, FILE-SVR-01
    (ART-001..ART-010) plus fileserver_access.evtx (ART-011).
  defanging_note: >
    Prose in this file defangs the C2 domain. Command values use
    the literal string where the tool requires it; no analyst
    should browse the domain.
