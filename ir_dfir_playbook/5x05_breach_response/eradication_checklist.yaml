      Remove Cobalt Strike beacon svchost32.exe (PID 7318 lineage,
      ART-001/ART-002 preserved) and keylogger temp file by gold
      image rebuild of the workstation.
    command_or_action: >
      Wipe and redeploy gold image via deployment server; rejoin
      domain only AFTER ERT-019 completes.
    verification_command: >
      Get-Process | Where-Object Name -eq 'svchost32';
      Test-Path 'C:\ProgramData\Microsoft\svchost32.exe',
      'C:\Windows\Temp\klog.tmp'
    expected_verification_result: >
      Empty process list; both Test-Path calls return False; EDR
      full-volume scan reports zero detections.
    status: pending
    executed_at: null
    executed_by: null
