    command_or_action: >
      Covered by rebuild (ERT-001); post-rebuild sweep of
      HKLM\...\Run, RunOnce, user Run keys, and schtasks for
      non-Microsoft authored tasks.
    verification_command: >
      Get-Service WinHealthSvc (expect does-not-exist error);
      reg query HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run;
      schtasks /query /fo csv | findstr /v /i "Microsoft"
    expected_verification_result: >
